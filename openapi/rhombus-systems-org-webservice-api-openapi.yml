components:
  schemas:
    Org_FindSCIMSettingsForOrgWSResponse:
      type: object
      description: Response object containing SCIM settings for organization.
      properties:
        scimSettings:
          $ref: '#/components/schemas/SCIMSettingsType'
    Org_GetFeaturesWSResponse:
      type: object
      description: Response object containing organization feature flags.
      properties:
        behaviorDetection:
          type:
          - boolean
          - 'null'
          description: Whether behavior detection is enabled
          example: false
        cloudArchiving:
          type:
          - boolean
          - 'null'
          description: Whether cloud archiving is enabled
          example: false
        engagementCounting:
          type:
          - boolean
          - 'null'
          description: Whether engagement counting is enabled
          example: false
        error:
          type:
          - boolean
          - 'null'
        errorMsg:
          type:
          - string
          - 'null'
        faceCounting:
          type:
          - boolean
          - 'null'
          description: Whether face counting is enabled
          example: false
        faceCountingNonUnique:
          type:
          - boolean
          - 'null'
          description: Whether non-unique face counting is enabled
          example: false
        faceRecognition:
          type:
          - boolean
          - 'null'
          description: Whether face recognition is enabled
          example: false
        licensePlateRecognition:
          type:
          - boolean
          - 'null'
          description: Whether license plate recognition is enabled
          example: false
        peopleCounting:
          type:
          - boolean
          - 'null'
          description: Whether people counting is enabled
          example: false
        ppeDetection:
          type:
          - boolean
          - 'null'
          description: Whether PPE detection is enabled
          example: false
        rulesEngine:
          type:
          - boolean
          - 'null'
          description: Whether rules engine is enabled (deprecated)
          example: false
        vehicleCounting:
          type:
          - boolean
          - 'null'
          description: Whether vehicle counting is enabled
          example: false
        warningMsg:
          type:
          - string
          - 'null'
    EnvoyLocationInfoType:
      type:
      - object
      - 'null'
      properties:
        assignedCameraList:
          type:
          - array
          - 'null'
          items:
            type:
            - string
            - 'null'
            format: RUUID
            description: base 64 (url-safe) uuid string
            example: AAAAAAAAAAAAAAAAAAAAAA
        locationName:
          type:
          - string
          - 'null'
    Org_UpdateSCIMSettingsForOrgWSResponse:
      type: object
      description: Response object for updating SCIM settings for organization.
      properties:
        error:
          type:
          - boolean
          - 'null'
        errorMsg:
          type:
          - string
          - 'null'
        warningMsg:
          type:
          - string
          - 'null'
    PlanTypeEnum:
      type: string
      enum:
      - TRIAL
      - STARTER
      - CUSTOM
    Org_RemovePendingRegistrationRequest:
      type: object
      properties:
        serialNumber:
          type:
          - string
          - 'null'
    PlaceOsSettings:
      type: object
      properties:
        alertUnauthorizedFaces:
          type:
          - boolean
          - 'null'
        apiUrl:
          type:
          - string
          - 'null'
        createSeekPoints:
          type:
          - boolean
          - 'null'
        doorInfoMap:
          type:
          - object
          - 'null'
          additionalProperties:
            $ref: '#/components/schemas/BadgeIntegrationDoorInfoType'
        enabled:
          type:
          - boolean
          - 'null'
        enabledTimestampMs:
          type:
          - integer
          - 'null'
          format: int64
        enablingUser:
          type:
          - string
          - 'null'
        enablingUserUuid:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
        identifyFacesFromBadge:
          type:
          - boolean
          - 'null'
        migrated:
          type:
          - boolean
          - 'null'
        rhombusToken:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
        saveClips:
          type:
          - boolean
          - 'null'
        webhookSignatureSecret:
          type:
          - string
          - 'null'
    CloudArchivingStrategyEnum:
