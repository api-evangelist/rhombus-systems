        triggers:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/BaseRuleTriggerType'
        uuid:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
    CustomLLMEventRuleTriggerType:
      type:
      - object
      - 'null'
      allOf:
      - type: object
        properties:
          deviceFacetUuids:
            type:
            - array
            - 'null'
            items:
              type:
              - string
              - 'null'
              format: DeviceFacetUuid
              description: RUUID with optional appended facet information
              example: AAAAAAAAAAAAAAAAAAAAAA.v0
          promptUuid:
            type:
            - string
            - 'null'
            format: RUUID
            description: base 64 (url-safe) uuid string
            example: AAAAAAAAAAAAAAAAAAAAAA
      properties:
        type:
          $ref: '#/components/schemas/RuleTriggerTypeEnum'
    PointType:
      type: object
      properties:
        x:
          type:
          - integer
          - 'null'
          format: int32
        y:
          type:
          - integer
          - 'null'
          format: int32
    Rules_GetRulesForOrgWSRequest:
      type: object
      description: Request object for getting rules for an organization.
    Rules_records_GetRulesFilteredWSRequest:
      type: object
      description: Request object for getting filtered rules.
      properties:
        associatedUuids:
          type:
          - array
          - 'null'
          description: List of associated UUIDs to filter by
          items:
            type:
            - string
            - 'null'
            format: RUUID
            description: base 64 (url-safe) uuid string
            example: AAAAAAAAAAAAAAAAAAAAAA
        ruleTypeFilter:
          type:
          - array
          - 'null'
          description: List of rule types to filter by
          items:
            $ref: '#/components/schemas/RuleTypeEnum'
    IncomingWebhookRuleTriggerType:
      type:
      - object
      - 'null'
      allOf:
      - type: object
        properties:
          displayName:
            type:
            - string
            - 'null'
          webhookToken:
            type:
            - string
            - 'null'
            format: RUUID
            description: base 64 (url-safe) uuid string
            example: AAAAAAAAAAAAAAAAAAAAAA
      properties:
        type:
          $ref: '#/components/schemas/RuleTriggerTypeEnum'
    RuleTypeEnum:
      type: string
      enum:
      - BUTTON_DEFINED
      - USER_DEFINED
      - DOORBELL_CAMERA_DEFINED
      - DOOR_CONTROLLER_DEFINED
      - LOCKDOWN_PLAN_DEFINED
      - CUSTOM_LLM_DEFINED
      - ROBOT_DEFINED
      - SCHEDULED_REPORT_DEFINED
    ScheduledIntervalType:
      type: object
      description: Map of location UUIDs to snooze intervals
      properties:
        durationSecs:
          type:
          - integer
          - 'null'
          format: int64
        timestampSec:
          type:
          - integer
          - 'null'
          format: int64
        uuid:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
    AccessStateOverrideExpirationStrategyEnum:
      type: string
