          - string
          - 'null'
        warningMsg:
          type:
          - string
          - 'null'
    Relay_GetNVRDetailsWSRequest:
      type: object
      description: Request object for getting details for specified NVRs.
      properties:
        nvruuids:
          type:
          - array
          - 'null'
          description: List of NVR UUIDs to get details for
          items:
            type:
            - string
            - 'null'
            format: RUUID
            description: base 64 (url-safe) uuid string
            example: AAAAAAAAAAAAAAAAAAAAAA
    ThirdPartyCameraPasswordType:
      type: object
      description: List of third-party camera passwords
      properties:
        notes:
          type:
          - string
          - 'null'
        orgUuid:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
        password:
          type:
          - string
          - 'null'
        username:
          type:
          - string
          - 'null'
        uuid:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
    Relay_DiscoveryWithUnassignedRtspEndpoints:
      type: object
      description: Discovery information with unassigned RTSP endpoints available for assignment.
      properties:
        codec:
          type:
          - string
          - 'null'
          description: Codec of the discovered device
          example: H.264
        ipAddress:
          type:
          - string
          - 'null'
          description: IP address of the discovered device
          example: 192.168.1.100
        macAddress:
          type:
          - string
          - 'null'
          description: MAC address of the discovered device
        manufacturer:
          type:
          - string
          - 'null'
          description: Manufacturer of the discovered device
          example: Hikvision
        model:
          type:
          - string
          - 'null'
          description: Model of the discovered device
          example: DS-2CD2142FWD-I
        orgUuid:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
        unassignedRtspEndpoints:
          type:
          - array
          - 'null'
          description: List of unassigned RTSP endpoints that are available for assignment. Contains only endpoints with status GOOD and that are not currently assigned.
          items:
            $ref: '#/components/schemas/Relay_ExternalRtspEndpoint'
    Relay_PTZStatusWSResponse:
      type: object
      description: Response object containing PTZ status of a camera.
      properties:
        error:
          type:
          - boolean
          - 'null'
        errorMsg:
          type:
          - string
          - 'null'
        warningMsg:
          type:
          - string
          - 'null'
        xpositionPermyriad:
          type:
          - integer
          - 'null'
          format: int32
          description: Current X-axis position in permyriad units
          example: 5000
        ypositionPermyriad:
          type:
          - integer
          - 'null'
          format: int32
          description: Current Y-axis position in permyriad units
          example: 5000
        zpositionPermyriad:
          type:
          - integer
          - 'null'
          format: int32
          description: Current Z-axis position in permyriad units
          example: 5000
    UrlStatusEnum:
      type: string
      description: Status of the RTSP URL validation
      enum:
      - UNKNOWN
      - NOT_REACHABLE
      - NOT_AUTHENTICATED
      - NOT_SUPPORTED
      - GOOD
    Common_devices_GetUptimeWindowsWSResponse:
      type: object
      description: Response containing uptime information for a device.
      properties:
        error:
          type:
          - boolean
          - 'null'
        errorMsg:
          type:
          - string
          - 'null'
        uptimeWindows:
          type:
          - array
          - 'null'
          description: List of uptime windows for the device
          items:
            $ref: '#/components/schemas/TimeWindowSeconds'
        warningMsg:
          type:
          - string
          - 'null'
    Relay_ExternalRtspEndpoint:
      type: object
      description: External RTSP endpoint configuration for camera streams.
      properties:
        lastRtspUrlStatus:
          $ref: '#/components/schemas/UrlStatusEnum'
        lensRole:
          $ref: '#/components/schemas/LensRoleEnum'
        onvifProfileToken:
          type:
          - string
          - 'null'
          description: ONVIF media profile token backing this endpoint (multi-sensor grouping); null when unknown
        password:
          type:
          - string
          - 'null'
          description: Password for RTSP authentication
          example: password123
        rtspUrl:
          type:
          - string
          - 'null'
          description: RTSP URL for the camera stream
          example: rtsp://192.168.1.100:554/stream1
        source:
          $ref: '#/components/schemas/RtspEndpointSourceEnum'
        username:
          type:
          - string
          - 'null'
          description: Username for RTSP authentication
          example: admin
        uuid:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
    Relay_CreateThirdPartyCameraPasswordWSResponse:
      type: object
      description: Response object for creating a third-party camera password.
      properties:
        error:
          type:
          - boolean
          - 'null'
        errorMsg:
          type:
          - string
          - 'null'
        passwordUuid:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
        warningMsg:
          type:
          - string
          - 'null'
    RtspEndpointSourceEnum:
      type: string
      enum:
      - USER
      - ONVIF
    Relay_DeleteThirdPartyCameraPasswordWSResponse:
      type: object
      description: Response object for deleting a third-party camera password.
      properties:
        error:
          type:
          - boolean
          - 'null'
        errorMsg:
          type:
          - string
          - 'null'
        warningMsg:
          type:
          - string
          - 'null'
    Relay_GetMinimalNVRStateListWSResponse:
      type: object
      description: Response object containing basic state information about all NVRs in the organization.
      properties:
        error:
          type:
          - boolean
          - 'null'
        errorMsg:
          type:
          - string
          - 'null'
        nvrstates:
          type:
          - array
          - 'null'
          description: List of minimal NVR state information for all NVRs in the organization
          items:
            $ref: '#/components/schemas/MinimalNVRStateType'
        warningMsg:
          type:
          - string
          - 'null'
    Relay_FindDiscoveriesWithUnassignedRtspEndpointsWSRequest:
      type: object
      description: Request object for finding discoveries with unassigned RTSP endpoints.
    Relay_GetMinimalThirdPartyCameraStateListWSResponse:
      type: object
      description: Response object containing basic state information about all third-party cameras in the organization.
      properties:
        error:
          type:
          - boolean
          - 'null'
        errorMsg:
          type:
          - string
          - 'null'
        thirdPartyCameraStateList:
          type:
          - array
          - 'null'
          description: List of minimal third-party camera state information for all cameras in the organization
          items:
            $ref: '#/components/schemas/Relay_MinimalThirdPartyCameraStateType'
        warningMsg:
          type:
          - string
          - 'null'
    DeviceTypeEnum:
      type: string
      enum:
      - BLE_TRACKER
      - CAMERA
      - DOOR_SENSOR
      - ENVIRONMENTAL_SENSOR
      - OCCUPANCY_SENSOR
      - AUDIO_GATEWAY
      - EXECUTABLE
      - BADGE_READER
      - DOOR_CONTROLLER
      - BLE_BUTTON
      - IO_BOARD
      - ENVIRONMENTAL_GATEWAY
      - NVR
      - ROBOT
      - UNKNOWN
    Relay_GetRtspEndpointsWSRequest:
      type: object
      description: Request object for getting RTSP endpoints for a device with the specified MAC address.
      properties:
        discoveredCameraMacAddress:
          type:
          - string
          - 'null'
          description: MAC address of the discovered camera to get RTSP endpoints for
    Relay_AuthenticateThirdPartyCameraWSRequest:
      type: object
      description: Request object for authenticating a third-party camera with RTSP URL.
      properties:
        locationUuid:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
        password:
          type:
          - string
          - 'null'
          description: Password to access the RTSP URL. This field MUST be non-empty if trySavedCredentials is false
          example: password123
        rtspUrl:
          type:
          - string
          - 'null'
          description: The RTSP URL of the third-party camera. This RTSP URL should reference a stream that provides H.264 encoded video
          example: rtsp://192.168.1.100:554/stream1
        thirdPartyCameraMacAddress:
          type:
          - string
          - 'null'
          description: The MAC address of the third-party camera this request is operating on
        trySavedCredentials:
          type:
          - boolean
          - 'null'
          description: Whether the third-party credentials saved in the account should be used when trying to validate whether the provided RTSP URL is valid
          example: false
        username:
          type:
          - string
          - 'null'
          description: Username to access the RTSP URL. This field MUST be non-empty if trySavedCredentials is false
          example: admin
    CameraType:
      type: object
      description: List of third-party cameras assigned to the specified NVR
      properties:
        archiveRegion:
          type:
          - string
          - 'null'
        cameraFramerate:
          type:
          - integer
          - 'null'
          format: int32
        createdAtMillis:
          type:
          - integer
          - 'null'
          format: int64
        customData:
          type:
          - string
          - 'null'
        deleted:
          type:
          - boolean
          - 'null'
        description:
          type:
          - string
          - 'null'
        deviceFacetRadians:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - number
            - 'null'
            format: float
        directionRadians:
          type:
          - number
          - 'null'
          format: float
        facetNameMap:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
        floorNumber:
          type:
          - integer
          - 'null'
          format: int32
        hardwareId:
          type:
          - string
          - 'null'
        hwVariation:
          $ref: '#/components/schemas/HardwareVariationEnum'
        latitude:
          type:
          - number
          - 'null'
          format: double
        locationUuid:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
        longitude:
          type:
          - number
          - 'null'
          format: double
        mediaStorageDeviceUuid:
          type:
          - string
          - 'null'
          format: DeviceFacetUuid
          description: RUUID with optional appended facet information
          example: AAAAAAAAAAAAAAAAAAAAAA.v0
        mediaStorageDeviceUuidByFacet:
          type:
          - object
          - 'null'
          additionalProperties:
            type:
            - string
            - 'null'
            format: DeviceFacetUuid
            description: RUUID with optional appended facet information
            example: AAAAAAAAAAAAAAAAAAAAAA.v0
        mummified:
          type:
          - boolean
          - 'null'
        name:
          type:
          - string
          - 'null'
        orgUuid:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
        pending:
          type:
          - boolean
          - 'null'
        policyUuid:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
        serialNumber:
          type:
          - string
          - 'null'
        subLocationsHierarchyKey:
          type:
          - string
          - 'null'
          format: SubLocationsHierarchyKey
          description: 'A sequence of one or more base 64 (url-safe) uuid substrings.

            These substrings are separated by dots (.).

            '
          example: AAAAAAAAAAAAAAAAAAAAAA.AAAAAAAAAAAAAAAAAAAAAA.AAAAAAAAAAAAAAAAAAAAAA
          pattern: ^([A-Za-z0-9\-_]{22})([.][A-Za-z0-9\-_]{22})*$
        type:
          $ref: '#/components/schemas/DeviceTypeEnum'
        unregisteredEmailSent:
          type:
          - boolean
          - 'null'
        uuid:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
    Relay_IpProbeResultType:
      type: object
      description: Result of probing a single IP address during third-party camera discovery.
      properties:
        acceptedUsername:
          type:
          - string
          - 'null'
          description: Username of the credentials that succeeded, if any.
        codec:
          type:
          - string
          - 'null'
          description: Video codec(s) the device advertised over ONVIF (e.g. "H264"), if any.
        ipAddress:
          type:
          - string
          - 'null'
          description: The probed IP address.
        macAddress:
          type:
          - string
          - 'null'
          description: MAC address, if known.
        manufacturer:
          type:
          - string
          - 'null'
          description: Manufacturer reported over ONVIF, if any.
        model:
          type:
          - string
          - 'null'
          description: Model reported over ONVIF, if any.
        rtspFound:
          type:
          - boolean
          - 'null'
          description: Whether an RTSP stream URI was obtained for this IP.
        source:
          type:
          - string
          - 'null'
          description: 'How the IP was found: MULTICAST (WS-Discovery) or PORT_SCAN (554 open).'
        status:
          type:
          - string
          - 'null'
          description: 'ONVIF probe outcome: GOOD, NOT_SUPPORTED, NOT_AUTHENTICATED, NO_ONVIF, NOT_REACHABLE.'
        statusDetail:
          type:
          - string
          - 'null'
          description: Human-readable detail about the outcome — especially why a device that responded to ONVIF wasn't usable.
    Relay_ManualDiscoverThirdPartyCameraWSRequest:
      type: object
      description: Request object for manually discovering a third-party camera with RTSP URL.
      properties:
        locationUuid:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
        password:
          type:
          - string
          - 'null'
          description: Password to access the RTSP URL. This field MUST be non-empty if trySavedCredentials is false
          example: password123
        rtspUrl:
          type:
