          - api
          - partner-api-token
          - partner-api
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FormDataMultiPart'
        description: 'Multipart form-data containing a .jpg or .png file. Maximum file size: 5MB.'
      responses:
        '200':
          content:
            application/json:
              schema:
