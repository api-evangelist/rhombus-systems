      type: string
      enum:
      - PARTNER_DEVELOPER
      - DEVELOPER
      - INTERNAL_SALESFORCE
      - TVOS
      - WINDOWS
      - LINUX
      - KIOSK
      - KEYPAD
      - SQUARE
      - KISI
      - OPENPATH
      - TOAST
      - BOULEVARD
      - BRIVO
      - EXECUTABLE
      - HALO
      - SALTO
      - BUTTERFLYMX
      - GENEA
      - PRODATAKEY
      - ENVOY
      - AMT
      - PIMLOC
      - PLACEOS
      - OMNIALERT
      - FLIC
      - SHELLY_DEVICE_EVENT
      - NINEONEONECELLULAR
      - HONEYWELL_ELEMENTS
      - HONEYWELL_ONGUARD
      - HONEYWELL_NETBOX
      - TRITON
      - CHATBOT
      - SIGNATURE_API
      - INCOMING_WEBHOOK
      - UNKNOWN
