components:
  schemas:
    Event_GetSavedClipsWSRequest:
      type: object
      description: Request object for retrieving saved clips (deprecated).
    ClipSeekPointV2Type:
      type: object
      description: List of seek points for the clip
      properties:
        activity:
          $ref: '#/components/schemas/ActivityEnum'
        alert:
          type:
          - boolean
          - 'null'
        customActivityColor:
          $ref: '#/components/schemas/FootageSeekPointColorEnum'
        customActivityDescription:
          type:
          - string
          - 'null'
        customActivityDisplayName:
          type:
          - string
          - 'null'
        dcao:
          type:
          - boolean
          - 'null'
        dwelling:
          type:
          - boolean
          - 'null'
        faceName:
          type:
          - string
          - 'null'
        id:
          type:
          - integer
          - 'null'
          format: int32
        inMotion:
          type:
          - boolean
          - 'null'
        licensePlate:
          type:
          - string
          - 'null'
        loudness:
          type:
          - integer
          - 'null'
          format: int32
        pose:
          type:
          - string
          - 'null'
        relativeSecond:
          type:
          - number
          - 'null'
          format: float
        sensorValType:
          $ref: '#/components/schemas/SensorValType'
        stableTrackId:
          type:
          - integer
          - 'null'
          format: int32
        toastOrderIdInfo:
          $ref: '#/components/schemas/ToastOrderIdType'
        tu:
          type:
          - string
          - 'null'
        unidentifiedFaceId:
          type:
          - string
          - 'null'
        vehicleName:
          type:
          - string
          - 'null'
    Event_DeleteSharedClipGroupWSResponse:
      type: object
      description: Response object for deleting a shared clip group.
      properties:
        error:
          type:
          - boolean
          - 'null'
        errorMsg:
          type:
          - string
          - 'null'
        warningMsg:
          type:
          - string
          - 'null'
    Event_GetSharedClipGroupsV2WSRequest:
      type: object
      description: Request object for retrieving shared clip groups with date filtering.
      properties:
        createdAfterMs:
          type:
          - integer
          - 'null'
          format: int64
          description: Filter for clip groups created after this timestamp
          example: 1640995200000
        createdBeforeMs:
          type:
          - integer
          - 'null'
          format: int64
          description: Filter for clip groups created before this timestamp
          example: 1641081600000
    Event_DeleteSharedClipGroupWSRequest:
      type: object
      description: Request object for deleting a shared clip group.
      properties:
        uuid:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
    Resolution:
      type: object
      properties:
        height:
          type:
          - integer
          - 'null'
          format: int32
        width:
          type:
          - integer
          - 'null'
          format: int32
    PointType:
      type: object
      properties:
        x:
          type:
          - integer
          - 'null'
          format: int32
        y:
          type:
          - integer
          - 'null'
          format: int32
    Event_DeleteAlertMonitoringThreatCaseByStatusWSRequest:
      type: object
      description: Request object for deleting alert monitoring threat cases by status.
      properties:
        status:
          $ref: '#/components/schemas/ThreatCaseStatusEnum'
    ThreatCaseTimelineEventTypeEnum:
      type: string
      enum:
      - ALERT
      - DELAYED_ALERT
      - USER
      - SERVICE_PROVIDER
      - ERROR
      - PANIC_BUTTON
      - ACCESS_CONTROL_INTEGRATION
      - ALARM_INTEGRATION
      - UNKNOWN
    Event_GetPolicyAlertDetailsWSRequest:
      type: object
      description: Request object for retrieving detailed information about a policy alert.
      properties:
        policyAlertUuid:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
    Event_GetPolicyAlertCountWSRequest:
      type: object
      description: Request object for retrieving the count of policy alerts.
      properties:
        maxResultsSize:
          type:
          - integer
          - 'null'
          format: int32
          description: Maximum number of results to count
          example: 1000
    Event_GetPolicyAlertsV2WSRequest:
      type: object
      description: Request object for retrieving policy alerts V2 with filtering and pagination options.
      properties:
        afterTimestampMs:
          type:
          - integer
          - 'null'
          format: int64
          description: Filter for alerts after this timestamp
          example: 1640995200000
        beforeTimestampMs:
          type:
          - integer
          - 'null'
          format: int64
          description: Filter for alerts before this timestamp
          example: 1641081600000
        deviceFilter:
          type:
          - array
          - 'null'
          description: List of device UUIDs to filter by
          items:
            type:
            - string
            - 'null'
            format: RUUID
            description: base 64 (url-safe) uuid string
            example: AAAAAAAAAAAAAAAAAAAAAA
        lastTimestampMs:
          type:
          - integer
          - 'null'
          format: int64
          description: Last timestamp for pagination
          example: 1640995200000
        lastUuid:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
        locationFilter:
          type:
          - array
          - 'null'
          description: List of location UUIDs to filter by
          items:
            type:
            - string
            - 'null'
            format: RUUID
            description: base 64 (url-safe) uuid string
            example: AAAAAAAAAAAAAAAAAAAAAA
        maxResults:
          type:
          - integer
          - 'null'
          format: int32
          description: Maximum number of results to return
          example: 100
