        latitude:
          type:
          - number
          - 'null'
          format: double
          description: Latitude coordinate
          example: 37.7749
        leakDetected:
          type:
          - boolean
          - 'null'
          description: Whether a leak is detected
          example: false
        leakProbePresent:
          type:
          - boolean
          - 'null'
          description: Whether leak probe is present
          example: true
        locationUuid:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
        longitude:
          type:
          - number
          - 'null'
          format: double
          description: Longitude coordinate
          example: -122.4194
        name:
          type:
          - string
          - 'null'
