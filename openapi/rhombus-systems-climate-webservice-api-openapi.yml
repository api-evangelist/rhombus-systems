        customActivityDescription:
          type:
          - string
          - 'null'
        customActivityDisplayName:
          type:
          - string
          - 'null'
        dcao:
          type:
          - boolean
          - 'null'
        dwelling:
          type:
          - boolean
          - 'null'
        faceName:
          type:
          - string
          - 'null'
        id:
          type:
          - integer
          - 'null'
          format: int32
        inMotion:
          type:
          - boolean
          - 'null'
        licensePlate:
          type:
          - string
          - 'null'
        loudness:
          type:
          - integer
          - 'null'
          format: int32
        pose:
          type:
          - string
          - 'null'
        relativeSecond:
          type:
          - number
          - 'null'
          format: float
        sensorValType:
          $ref: '#/components/schemas/SensorValType'
        stableTrackId:
          type:
          - integer
          - 'null'
          format: int32
        toastOrderIdInfo:
          $ref: '#/components/schemas/ToastOrderIdType'
        tu:
          type:
          - string
          - 'null'
        unidentifiedFaceId:
          type:
          - string
          - 'null'
        vehicleName:
          type:
          - string
          - 'null'
    Climate_DeleteEnvironmentalGatewayWSResponse:
      type: object
      description: Response indicating the result of deleting an environmental gateway.
      properties:
        error:
          type:
          - boolean
          - 'null'
        errorMsg:
          type:
          - string
          - 'null'
        responseStatus:
          $ref: '#/components/schemas/WebResponseStatusEnum'
        warningMsg:
          type:
          - string
          - 'null'
    Climate_GetEventsForEnvironmentalGatewayWSRequest:
      type: object
      description: Request to retrieve events for an environmental gateway.
      properties:
        createdAfterMs:
          type:
          - integer
          - 'null'
          format: int64
          description: Timestamp in milliseconds after which events should be retrieved
          example: 1640991600000
        createdBeforeMs:
          type:
          - integer
          - 'null'
          format: int64
          description: Timestamp in milliseconds before which events should be retrieved
          example: 1640995200000
        deviceUuid:
          type:
          - string
          - 'null'
          format: RUUID
          description: base 64 (url-safe) uuid string
          example: AAAAAAAAAAAAAAAAAAAAAA
        lastEvaluatedKey:
          type:
          - string
          - 'null'
        maxPageSize:
          type:
          - integer
          - 'null'
          format: int32
          description: Maximum number of results to return per page
          example: 50
    PointType:
      type: object
      properties:
        x:
          type:
          - integer
          - 'null'
          format: int32
        y:
          type:
          - integer
          - 'null'
          format: int32
    Climate_MinimalEnvironmentalGatewayStateType:
      type: object
      description: Minimal environmental gateway state information.
      properties:
        activities:
          type:
          - array
          - 'null'
          description: List of detected activities
          items:
            $ref: '#/components/schemas/ActivityEnum'
        airQualityIndex:
          type:
          - integer
          - 'null'
          format: int32
