    get:
      description: User authorizes to share permission and ac settings, receives temporary authorization code
      operationId: authorize
      parameters:
      - in: query
        name: clientId
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: redirectUri
        schema:
