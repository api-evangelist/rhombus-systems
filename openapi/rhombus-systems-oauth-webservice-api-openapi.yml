          - string
          - 'null'
      - in: query
        name: responseType
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: state
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: consentGiven
        schema:
          type:
          - boolean
          - 'null'
      - in: query
        name: codeChallenge
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: client_id
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: redirect_uri
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: response_type
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: consent_given
        schema:
          type:
          - boolean
          - 'null'
      - in: query
        name: code_challenge
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: code_challenge_method
        schema:
          type:
          - string
          - 'null'
      - in: query
        name: resource
        schema:
          type:
          - string
          - 'null'
      - description: Authentication scheme identifier. Use `api-token` for standard API key authentication, `partner-api-token` for partner API key authentication. Must be paired with the `x-auth-apikey` header containing your API key.
        example: api-token
        in: header
        name: x-auth-scheme
        required: true
        schema:
          type: string
          default: api-token
          enum:
          - api-token
          - api
          - partner-api-token
          - partner-api
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
          description: OK
      summary: Authorize OAuth application
      tags:
      - OAuth Webservice
