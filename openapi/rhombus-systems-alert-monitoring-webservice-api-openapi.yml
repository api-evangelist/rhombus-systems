          application/json:
            schema:
              $ref: '#/components/schemas/Alertmonitoring_GetNoonlightSettingsForLocationWSRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alertmonitoring_GetNoonlightSettingsForLocationWSResponse'
