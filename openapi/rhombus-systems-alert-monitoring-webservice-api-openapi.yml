          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alertmonitoring_CreateCustomPinForNoonlightWSResponse'
          description: OK
      summary: Create custom PIN for location
      tags:
      - Alert Monitoring Webservice
  /api/alertmonitoring/createPinForLocation:
