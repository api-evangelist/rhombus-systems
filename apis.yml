aid: rhombus-systems
name: Rhombus Systems
description: >-
  Rhombus Systems is a Sacramento, California enterprise physical-security platform that unifies
  AI-powered security cameras, door access control, environmental and IoT sensors, audio gateways
  and TMA Five Diamond alarm monitoring in a single cloud console. The platform is API-first: every
  feature in the web console, mobile apps and firmware is backed by the same public REST API, which
  publishes an OpenAPI 3.0 contract of 952 operations across 64 service groups covering cameras and
  video streaming, access control credentials and doors, lockdown plans, face recognition, license
  plate and vehicle recognition, scene query, occupancy and reporting, policy alerts, webhooks,
  partner/MSP org management, and SAML SSO with SCIM provisioning. Rhombus also ships an AsyncAPI 3.0
  contract for its STOMP-over-WebSocket change-event stream, an RFC 9727 API catalog, RFC 9728/8414
  OAuth discovery, an A2A agent card, an llms.txt family, a Model Context Protocol server, a Go CLI,
  a React SDK, and a published Claude Code skills library.
image: https://rhombus.com/img/meta-homepage.png
url: https://raw.githubusercontent.com/api-evangelist/rhombus-systems/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
specificationVersion: '0.20'
created: '2026-08-26'
modified: '2026-08-26'
tags:
- Physical Security
- Video Surveillance
- Access Control
- IoT Sensors
- Cloud Video Management
- Alarm Monitoring
- Computer Vision
- Building Management
- Security Cameras
- Company
apis:
- aid: rhombus-systems-console-websocket-api
  name: Rhombus Console WebSocket API
  description: >-
    Real-time organization change events delivered over a STOMP 1.2 session framed on a secure WebSocket.
    Clients subscribe to /topic/change/{orgUuid} and receive a MESSAGE frame for every entity change in
    the org — policy alerts, device state changes, sensor readings and door events. Published by Rhombus
    as an AsyncAPI 3.0.0 document.
  humanURL: https://api-docs.rhombus.community/websocket/overview
  baseURL: wss://ws.rhombussystems.com:8443/websocket
  tags:
  - Events
  - WebSocket
  - Streaming
  properties:
  - type: AsyncAPI
    url: asyncapi/rhombus-systems-console-websocket-asyncapi.json
  - type: Documentation
    url: https://api-docs.rhombus.community/websocket/overview
