apis:
- aid: rhombus-systems-public-api
  name: Rhombus Public REST API
  description: >-
    The Rhombus public REST API — 952 JSON-over-HTTPS operations (all POST) across cameras, video,
    access control, sensors, climate, events, policy alerts, reporting, face and vehicle recognition,
    scene query, licensing, org and partner management. Authenticated with an API key header pair
    (x-auth-scheme + x-auth-apikey) or OAuth 2.0 authorization code with PKCE.
  humanURL: https://api-docs.rhombus.community/
  baseURL: https://api2.rhombussystems.com/api
  tags:
  - Physical Security
  - Video Surveillance
  - Access Control
  - IoT Sensors
  properties:
  - type: OpenAPI
    url: openapi/rhombus-systems-openapi.json
  - type: Overlay
    url: overlays/rhombus-systems-openapi-overlay.yaml
  - type: Documentation
    url: https://api-docs.rhombus.community/
  - type: APIReference
    url: https://api-docs.rhombus.community/_llms/en/api-reference.md
- aid: rhombus-systems-console-websocket-api
  name: Rhombus Console WebSocket API
  description: >-
    Real-time organization change events delivered over a STOMP 1.2 session framed on a secure
    WebSocket. Clients subscribe to /topic/change/{orgUuid} and receive a MESSAGE frame for every
    entity change in the org — policy alerts, device state changes, sensor readings and door events.
    Published by Rhombus as an AsyncAPI 3.0.0 document.
  humanURL: https://api-docs.rhombus.community/websocket/overview
  baseURL: wss://ws.rhombussystems.com:8443/websocket
  tags:
  - Events
  - WebSocket
  - Streaming
  properties:
  - type: AsyncAPI
    url: asyncapi/rhombus-systems-console-websocket-asyncapi.json
  - type: Documentation
    url: https://api-docs.rhombus.community/websocket/overview
