- status: 403
  title: Forbidden
  body: '{"status": 403, "error": "Forbidden", "timestamp": ..., "msg": "Access Denied"}'
  meaning: Credential present but invalid, expired, or lacking permission.
  remediation: >-
    Re-check the key or token. If an OAuth access token has expired, claim a new one with
    grant_type=refresh_token. If it is a permissions problem, the key's owning user needs a
    broader role — an API key inherits the permissions of the user who created it.
  retryable: false
  source: https://www.rhombus.com/auth.md
