  note: The shape differs by status — 401 is a boolean flag, 403 is a status/error/timestamp/msg object.
  discovery_header: >-
    WWW-Authenticate: Bearer resource_metadata="https://api2.rhombussystems.com/.well-known/oauth-protected-resource"
    is returned on 401, making the whole RFC 9728 -> RFC 8414 auth-discovery chain reachable from
    a single unauthenticated probe.
