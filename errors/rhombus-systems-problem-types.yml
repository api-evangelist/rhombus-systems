- status: 401
  title: Authentication failed
  body: '{"authenticationFailed": true}'
  meaning: No credential was supplied, or the request matched no auth scheme.
  remediation: >-
    Read the RFC 9728 protected-resource document named in the WWW-Authenticate challenge,
    obtain a credential (API key or OAuth access token), and retry.
  retryable: false
